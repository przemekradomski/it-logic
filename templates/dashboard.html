{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="Odkryj komputery, podzespoły i akcesoria w sklepie IT Logic.">
    <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/pwa-192.png' %}">
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'assets/main.css' %}?v={{ static_version }}">
    <title>{{ title }}</title>
</head>
<body>
    <div id="root"></div>

    {% if vite_server_url %}
        <script type="module" src="{{ vite_server_url }}/@vite/client"></script>
        <script type="module" src="{{ vite_server_url }}/src/main.jsx"></script>
    {% else %}
        <script type="module" src="{% static 'js/main.js' %}?v={{ static_version }}"></script>
    {% endif %}
</body>
</html>
